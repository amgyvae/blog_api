services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    env_file:
      - settings/.env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/db
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application

  celery_worker:
    build: .
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/db
    command: celery -A settings worker -l info

  celery_beat:
    build: .
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/db
    command: celery -A settings beat -l info

  flower:
    build: .
    env_file:
      - settings/.env
    depends_on:
      - redis
    ports:
      - "5555:5555"
    volumes:
      - sqlite_data:/app/db
    command: >
      celery -A settings flower --basic-auth=${BLOG_FLOWER_USER}:${BLOG_FLOWER_PASSWORD} --port=5555

volumes:
  sqlite_data: