services:
  redis:
    image: redis:7-alpine

  web:
    build: .
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/db
      - static_data:/app/static
      - media_data:/app/media
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application

  celery_worker:
    build: .
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/db
    command: celery -A settings worker -l info

  celery_beat:
    build: .
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/db
    command: celery -A settings beat -l info

  flower:
    build: .
    env_file:
      - settings/.env
    depends_on:
      - redis
    ports:
      - "5555:5555"
    volumes:
      - sqlite_data:/app/db
    command: >
      celery -A settings flower --basic-auth=${BLOG_FLOWER_USER}:${BLOG_FLOWER_PASSWORD} --port=5555

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    restart: unless-stopped

volumes:
  sqlite_data:
  static_data:  
  media_data: